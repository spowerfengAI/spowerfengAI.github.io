<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>點我+1｜6×6 連鎖版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
:root {
  --bg1: #0d0221;
  --bg2: #1a0533;
  --accent: #f43f5e;
  --gold: #fbbf24;
  --purple: #8b5cf6;
  --cyan: #06b6d4;
  --font: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg1);
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
  overflow: hidden;
  touch-action: manipulation;
}
/* Animated BG */
.bg-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
.container {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(255,255,255,0.12);
  padding: clamp(16px,4vw,28px);
  border-radius: 40px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
  width: 100%; max-width: 440px;
  display: flex; flex-direction: column; align-items: center;
  backdrop-filter: blur(20px);
}
/* Title */
.title-wrap { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.title-icon { font-size:1.8rem; animation: floatIcon 3s ease-in-out infinite; }
@keyframes floatIcon { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-6px) rotate(5deg)} }
h1 {
  font-size:1.4rem; font-weight:900; letter-spacing:4px;
  background: linear-gradient(135deg, #f43f5e 0%, #fb923c 40%, #fbbf24 70%, #a78bfa 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 0 12px rgba(244,63,94,0.4));
}
/* Stats */
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; margin-bottom:10px; }
.stat-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 10px 6px; border-radius:16px; text-align:center;
  transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-2px); }
.stat-card label { display:block; font-size:0.55rem; color:rgba(255,255,255,0.4); font-weight:800; margin-bottom:3px; text-transform:uppercase; letter-spacing:1px; }
.stat-card span { font-size:1rem; font-weight:900; color:#fff; }
.stat-card.hot { background:rgba(244,63,94,0.15); border-color:rgba(244,63,94,0.3); }
.stat-card.hot span { color:#fb7185; }
/* Score */
.score-wrap { position:relative; margin:4px 0 12px; }
.score-val {
  font-size: clamp(3rem,10vw,4.5rem); font-weight:900; color:#fff;
  letter-spacing:-4px; text-align:center;
  text-shadow: 0 0 40px rgba(139,92,246,0.5), 0 4px 20px rgba(0,0,0,0.4);
  transition: transform 0.1s;
}
.score-val.bump { animation: scoreBump 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes scoreBump { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
/* Energy */
.energy-bar-container { width:100%; margin-bottom:16px; }
.energy-text { font-size:0.72rem; font-weight:800; margin-bottom:6px; display:flex; justify-content:space-between; color:rgba(255,255,255,0.5); }
.energy-pips { display:flex; gap:6px; }
.pip {
  flex:1; height:10px; border-radius:20px;
  background: rgba(255,255,255,0.1);
  transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  position: relative; overflow:hidden;
}
.pip.active {
  background: linear-gradient(90deg, #f43f5e, #fb923c);
  box-shadow: 0 0 10px rgba(244,63,94,0.6);
}
.pip.active::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: pipShine 1.5s infinite;
}
@keyframes pipShine { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
/* Board */
.game-board-wrapper {
  position:relative; width:100%; padding:12px;
  background: linear-gradient(145deg, #1e0a3c, #0d0221);
  border-radius:28px;
  border: 1px solid rgba(139,92,246,0.3);
  box-shadow: 0 0 0 1px rgba(139,92,246,0.1), 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
  margin-bottom:16px;
}
.board-glow {
  position:absolute; inset:-1px; border-radius:28px; pointer-events:none;
  background: radial-gradient(ellipse at 50% 0%, rgba(139,92,246,0.15) 0%, transparent 70%);
}
.game-board {
  display:grid; grid-template-columns:repeat(6,1fr); gap:6px;
  aspect-ratio:1/1; width:100%;
}
/* Cells */
.cell {
  position:relative; border-radius:13px;
  display:flex; justify-content:center; align-items:center;
  font-size:clamp(1.4rem,4.5vw,1.9rem); font-weight:900;
  cursor:pointer; user-select:none;
  transition: transform 0.12s, box-shadow 0.2s;
  overflow:hidden;
   width:100%; aspect-ratio:1/1; min-width:0; min-height:0;
}
.cell::before {
  content:''; position:absolute; inset:0; border-radius:14px;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 60%);
  z-index:2; pointer-events:none;
}
.cell::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:4px;
  background: rgba(0,0,0,0.25); border-radius:0 0 14px 14px;
  z-index:2; pointer-events:none;
}
.cell:active { transform: scale(0.9); }
.cell span { position:relative; z-index:3; color:#fff; pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
/* Cell colors - richer gradients */
.c1  { background: linear-gradient(135deg,#ff6b9d,#ff8fab); box-shadow:0 4px 15px rgba(255,107,157,0.4); }
.c2  { background: linear-gradient(135deg,#4facfe,#00f2fe); box-shadow:0 4px 15px rgba(79,172,254,0.4); }
.c3  { background: linear-gradient(135deg,#43e97b,#38f9d7); box-shadow:0 4px 15px rgba(67,233,123,0.4); }
.c4  { background: linear-gradient(135deg,#fa709a,#fee140); box-shadow:0 4px 15px rgba(250,112,154,0.4); }
.c5  { background: linear-gradient(135deg,#a18cd1,#fbc2eb); box-shadow:0 4px 15px rgba(161,140,209,0.4); }
.c6  { background: linear-gradient(135deg,#f093fb,#f5576c); box-shadow:0 4px 15px rgba(240,147,251,0.5); }
.c7  { background: linear-gradient(135deg,#4facfe,#764ba2); box-shadow:0 4px 15px rgba(118,75,162,0.5); }
.c8  { background: linear-gradient(135deg,#667eea,#764ba2); box-shadow:0 4px 15px rgba(102,126,234,0.5); }
.c9  { background: linear-gradient(135deg,#f7971e,#ffd200); box-shadow:0 4px 15px rgba(247,151,30,0.5); }
.c10 { background: linear-gradient(135deg,#f43f5e,#7c3aed); box-shadow:0 4px 15px rgba(244,63,94,0.6); }
/* Animations */
.cell.dropping { animation: dropIn 0.45s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes dropIn { 0%{transform:translateY(-50px) scale(0.7);opacity:0} 100%{transform:translateY(0) scale(1);opacity:1} }
.cell.merging { z-index:200!important; transition:transform 0.2s ease,opacity 0.2s ease!important; }
.cell.target-pulse { animation: tPulse 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes tPulse { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
.cell.idle-bounce { animation: idleBounce 0.5s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes idleBounce { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }
/* Shake */
@keyframes shake {
  0%{transform:translate(2px,2px) rotate(0deg)} 10%{transform:translate(-2px,-3px) rotate(-1deg)}
  20%{transform:translate(-4px,0) rotate(1deg)} 30%{transform:translate(4px,3px) rotate(0deg)}
  40%{transform:translate(2px,-2px) rotate(1deg)} 50%{transform:translate(-2px,3px) rotate(-1deg)}
  60%{transform:translate(-4px,2px) rotate(0deg)} 70%{transform:translate(4px,2px) rotate(-1deg)}
  80%{transform:translate(-2px,-2px) rotate(1deg)} 90%{transform:translate(2px,3px) rotate(0deg)}
  100%{transform:translate(2px,-3px) rotate(-1deg)}
}
.shake-active { animation: shake 0.18s infinite; }
/* Buttons */
.btn-row { display:flex; gap:10px; width:100%; }
.btn {
  flex:1; padding:14px; border-radius:18px; border:none;
  font-family:var(--font); font-weight:900; font-size:1rem;
  cursor:pointer; letter-spacing:2px; transition:all 0.1s;
  position:relative; overflow:hidden;
}
.btn::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  pointer-events:none;
}
.btn-reset {
  background: linear-gradient(135deg,#7c3aed,#4f46e5);
  color:#fff;
  box-shadow: 0 6px 0 #3730a3, 0 10px 30px rgba(124,58,237,0.4);
}
.btn-reset:active { transform:translateY(4px); box-shadow:0 2px 0 #3730a3; }
.btn-hint {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:rgba(255,255,255,0.7);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow: 0 6px 0 #020617, 0 10px 20px rgba(0,0,0,0.3);
  flex:0 0 auto; padding:14px 18px;
}
.btn-hint:active { transform:translateY(4px); box-shadow:0 2px 0 #020617; }
/* Hint highlight */
.cell.hint-glow { animation: hintGlow 0.8s ease-in-out infinite alternate; }
@keyframes hintGlow {
  0%{box-shadow:0 0 0 3px rgba(251,191,36,0.4), 0 0 20px rgba(251,191,36,0.3)}
  100%{box-shadow:0 0 0 5px rgba(251,191,36,0.8), 0 0 35px rgba(251,191,36,0.6)}
}
.boss-cell { animation: bossPulse 1s ease-in-out infinite; }
@keyframes bossPulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.35)} }


.cell.near-match { animation: nearPulse .7s ease-in-out infinite alternate; }
@keyframes nearPulse { from{filter:brightness(1)} to{filter:brightness(1.28)} }



.cell.chain-explode{animation:chainExplode .42s ease-out forwards!important;z-index:80}
@keyframes chainExplode{
  0%{transform:scale(1);opacity:1}
  50%{transform:scale(1.28);filter:brightness(2)}
  100%{transform:scale(.08);opacity:0}
}
.cell.special-bomb span::before{content:'💣';font-size:1.15em}
.cell.special-star{background:linear-gradient(135deg,#fff7ad,#fbbf24 40%,#f59e0b 70%,#78350f)!important;box-shadow:0 0 0 3px rgba(251,191,36,.85),0 0 30px rgba(251,191,36,.75)!important;animation:specialStar .8s ease-in-out infinite}
.cell.special-star span::before{content:'⚡';font-size:1.15em}
.cell.special-rainbow{background:conic-gradient(#f43f5e,#fbbf24,#43e97b,#06b6d4,#8b5cf6,#f43f5e)!important;box-shadow:0 0 0 3px rgba(255,255,255,.7),0 0 32px rgba(6,182,212,.8)!important;animation:specialRainbow 1.6s linear infinite}
.cell.special-rainbow span::before{content:'🌈';font-size:1.08em}
@keyframes specialBomb{0%,100%{transform:scale(1)}50%{transform:scale(1.08) rotate(-4deg)}}
@keyframes specialStar{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(8deg)}}
@keyframes specialRainbow{to{filter:hue-rotate(360deg)}}

/* Gameplay upgrades */
.challenge-panel {
  width:100%; margin:0 0 12px; padding:10px 12px;
  border:1px solid rgba(251,191,36,.18); border-radius:16px;
  background:linear-gradient(135deg,rgba(251,191,36,.09),rgba(139,92,246,.08));
}
.challenge-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.challenge-title { font-size:.68rem; font-weight:900; color:rgba(255,255,255,.55); letter-spacing:1px; }
.challenge-progress { font-size:.72rem; font-weight:900; color:#fbbf24; }
.challenge-track { height:6px; margin-top:7px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; }
.challenge-fill { height:100%; width:0%; background:linear-gradient(90deg,#fbbf24,#fb7185); border-radius:10px; transition:width .35s ease; }

.power-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; margin-bottom:12px; }
.power-btn {
  border:1px solid rgba(255,255,255,.1); border-radius:15px; padding:10px 8px;
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  color:#fff; font-family:var(--font); font-weight:900; cursor:pointer;
  box-shadow:0 5px 16px rgba(0,0,0,.2); transition:.15s;
}
.power-btn:hover { transform:translateY(-2px); border-color:rgba(251,191,36,.35); }
.power-btn:active { transform:translateY(2px); }
.power-btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
.power-btn small { display:block; margin-top:2px; color:rgba(255,255,255,.45); font-size:.58rem; }
.double-active { border-color:rgba(251,191,36,.8); box-shadow:0 0 18px rgba(251,191,36,.25); }

.streak-wrap { display:flex; align-items:center; gap:7px; margin:-3px 0 9px; width:100%; }
.streak-label { font-size:.62rem; color:rgba(255,255,255,.4); font-weight:900; }
.streak-timer { flex:1; height:5px; background:rgba(255,255,255,.07); border-radius:10px; overflow:hidden; }
.streak-fill { height:100%; width:100%; background:linear-gradient(90deg,#06b6d4,#8b5cf6,#f43f5e); transform-origin:left; transition:width .1s linear; }

/* Modal */
.modal {
  position:fixed; inset:0; background:rgba(5,0,20,0.92);
  display:none; align-items:center; justify-content:center;
  z-index:1000; backdrop-filter:blur(16px);
}
.modal.active { display:flex; animation: modalIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes modalIn { 0%{opacity:0;transform:scale(0.8)} 100%{opacity:1;transform:scale(1)} }
.modal-card {
  background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.15);
  padding:50px 30px; border-radius:36px; text-align:center;
  width:90%; max-width:360px;
  box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
}
.modal-card h2 { font-size:2rem; font-weight:900; color:#fff; }
.modal-card p { color:rgba(255,255,255,0.5); margin-top:8px; font-weight:700; }
.modal-score { font-size:4.5rem; font-weight:900; letter-spacing:-4px; margin:16px 0 30px; background:linear-gradient(135deg,#f43f5e,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.modal-btn { width:100%; padding:16px; border-radius:18px; border:none; background:linear-gradient(135deg,#f43f5e,#e11d48); color:#fff; font-family:var(--font); font-weight:900; font-size:1.1rem; cursor:pointer; box-shadow:0 6px 0 #9f1239, 0 10px 30px rgba(244,63,94,0.4); letter-spacing:2px; transition:all 0.1s; }
.modal-btn:active { transform:translateY(4px); box-shadow:0 2px 0 #9f1239; }
/* Floating feedback */
.floating-container { position:fixed; pointer-events:none; z-index:2000; display:flex; flex-direction:column; align-items:center; }
.floating-pts { color:#fff; font-weight:900; font-size:1.5rem; animation:ptsFly 0.9s ease-out forwards; text-shadow:0 0 20px rgba(251,191,36,0.8), 0 2px 8px rgba(0,0,0,0.5); }
@keyframes ptsFly { 0%{transform:translateY(0) scale(0.5);opacity:0} 15%{opacity:1;transform:translateY(-10px) scale(1.1)} 100%{transform:translateY(-70px) scale(0.9);opacity:0} }
.floating-combo { color:#fbbf24; font-weight:900; font-size:1.875rem; font-style:italic; animation:comboPop 0.9s cubic-bezier(0.34,1.56,0.64,1) forwards; text-shadow:0 0 30px rgba(251,191,36,0.8); margin-top:-8px; }
@keyframes comboPop { 0%{transform:scale(0.15) rotate(-20deg);opacity:0} 35%{transform:scale(1.2) rotate(10deg);opacity:1} 100%{transform:translateY(-60px) scale(0.825) rotate(0deg);opacity:0} }
/* Particle canvas */
.particle-canvas { position:fixed; inset:0; pointer-events:none; z-index:500; }
/* Level badge */
.level-badge {
  position:absolute; top:-12px; right:20px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000; font-weight:900; font-size:0.65rem;
  padding:4px 12px; border-radius:20px; letter-spacing:2px;
  box-shadow:0 4px 12px rgba(251,191,36,0.5);
}
/* Multiplier display */
.multiplier-wrap { display:flex; align-items:center; gap:8px; margin-bottom:10px; width:100%; }
.multiplier-label { font-size:0.65rem; color:rgba(255,255,255,0.4); font-weight:800; text-transform:uppercase; letter-spacing:1px; }
.multiplier-val { font-size:1.1rem; font-weight:900; color:#fbbf24; text-shadow:0 0 15px rgba(251,191,36,0.6); transition:all 0.3s; }
.multiplier-bar { flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:10px; overflow:hidden; }
.multiplier-fill { height:100%; background:linear-gradient(90deg,#fbbf24,#f59e0b); border-radius:10px; transition:width 0.4s cubic-bezier(0.34,1.56,0.64,1); }

.queued-click{outline:3px solid #fbbf24!important;box-shadow:0 0 18px rgba(251,191,36,.9)!important;animation:queuePulse .45s ease-in-out infinite alternate}
@keyframes queuePulse{from{transform:scale(.96)}to{transform:scale(1.04)}}

/* ═════════════════ MAGIC FANTASY THEME ═════════════════ */

  --bg1:#07031a; --bg2:#12052b; --accent:#c084fc; --gold:#f5d76e;
  --purple:#8b5cf6; --cyan:#67e8f9; --font:'Nunito','PingFang TC','Microsoft JhengHei',sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 10%,rgba(139,92,246,.22),transparent 34%),
    radial-gradient(circle at 20% 80%,rgba(34,211,238,.10),transparent 28%),
    linear-gradient(160deg,#10052b 0%,#07031a 55%,#02010a 100%);
}
.container{
  background:
    linear-gradient(155deg,rgba(255,255,255,.09),rgba(139,92,246,.055)),
    radial-gradient(circle at 50% 0%,rgba(192,132,252,.14),transparent 55%);

  box-shadow:
    0 0 0 1px rgba(255,255,255,.05),
    0 30px 90px rgba(0,0,0,.72),

}
.title-wrap{position:relative}
.title-icon{filter:drop-shadow(0 0 9px rgba(216,180,254,.8))}

}

  background:linear-gradient(145deg,rgba(124,58,237,.12),rgba(255,255,255,.035));

  text-shadow:0 0 36px rgba(167,139,250,.66),0 0 8px rgba(103,232,249,.18);
}
.multiplier-val{color:#e9d5ff;text-shadow:0 0 18px rgba(192,132,252,.7)}
.multiplier-fill{background:linear-gradient(90deg,#7c3aed,#c084fc,#67e8f9)}
.multiplier-bar{background:rgba(216,180,254,.08)}
.energy-bar-container .energy-text span:first-child{color:#c4b5fd}
.pip.active{
  background:linear-gradient(90deg,#7c3aed,#c084fc,#67e8f9);
  box-shadow:0 0 12px rgba(192,132,252,.65);
}
.game-board-wrapper{
  background:
    radial-gradient(circle at 50% 45%,rgba(124,58,237,.11),transparent 58%),
    linear-gradient(145deg,#12052d,#050211);
  border-color:rgba(192,132,252,.34);
  box-shadow:0 0 0 1px rgba(139,92,246,.12),0 20px 48px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,255,255,.08),0 0 42px rgba(139,92,246,.10);
}
.board-glow{background:radial-gradient(ellipse at 50% 0%,rgba(192,132,252,.20),transparent 68%)}
.level-badge{
  background:linear-gradient(135deg,#f5d76e,#eab308);
  color:#2e1065;
  box-shadow:0 4px 16px rgba(245,215,110,.45),0 0 18px rgba(245,215,110,.18);
}
.cell{
  border:1px solid rgba(255,255,255,.08);
  background-blend-mode:screen;
  box-shadow:0 4px 15px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.22);
}
.cell span{text-shadow:0 2px 10px rgba(0,0,0,.68),0 0 8px rgba(255,255,255,.08)}
.c1{background:linear-gradient(135deg,#7c3aed,#ec4899)}
.c2{background:linear-gradient(135deg,#2563eb,#22d3ee)}
.c3{background:linear-gradient(135deg,#059669,#34d399)}

</style>

<style id="meteor-v18-css">
#meteor-spell-stable,#meteor-spell-overlay{display:none!important}
#energy-warning-toast{
  position:fixed;left:50%;top:78%;transform:translate(-50%,10px) scale(.92);
  z-index:2147483647;pointer-events:none;opacity:0;
  padding:11px 18px;border-radius:16px;
  background:linear-gradient(135deg,rgba(49,12,75,.96),rgba(76,29,149,.96));
  border:1px solid rgba(253,230,138,.5);
  color:#fff7ed;font-weight:1000;font-size:.82rem;letter-spacing:1px;
  box-shadow:0 0 30px rgba(168,85,247,.45),0 10px 30px rgba(0,0,0,.4);

}

#meteor-runtime-v18{
  position:fixed;inset:0;z-index:2147483647;pointer-events:none;overflow:hidden;
}
.m18-meteor{
  position:fixed;width:84px;height:155px;left:0;top:0;opacity:0;
  border-radius:50%;
  background:radial-gradient(circle at 50% 18%,#fff 0 7%,#ffe89a 16%,#ffb000 38%,#ff6818 62%,#c62828 82%,#54208a 100%);
  box-shadow:0 0 20px #fff,0 0 45px #ffe680,0 0 90px #ff7a18,0 0 140px rgba(168,85,247,.92);
  will-change:left,top,transform,opacity;
}
.m18-meteor:before{
  content:'';position:absolute;left:50%;bottom:66%;width:180px;height:520px;
  transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(to top,rgba(255,255,255,.2),rgba(255,220,130,.55),rgba(255,126,42,.35),rgba(168,85,247,.15),transparent);
  filter:blur(13px);
}
.m18-meteor:after{
  content:'✦';position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  color:#fff;font-size:34px;text-shadow:0 0 15px #fff,0 0 34px #ffe680,0 0 64px #ff7a18;
}
.m18-flash{
  position:fixed;inset:0;opacity:0;
  background:radial-gradient(circle at var(--ix) var(--iy),#fff 0 4%,rgba(255,225,125,.84) 10%,rgba(255,113,30,.45) 20%,rgba(168,85,247,.18) 38%,transparent 66%);

.m18-ring{
  position:fixed;left:var(--ix);top:var(--iy);width:26px;height:26px;
  border:6px solid rgba(255,255,255,.92);border-radius:50%;opacity:0;

  box-shadow:0 0 30px #fff,0 0 70px #ffe680,0 0 120px #a855f7;
}

  position:fixed;left:var(--ix);top:calc(var(--iy) + 120px);
  transform:translate(-50%,-50%) scale(.72);opacity:0;
  color:#fff7ed;font-size:clamp(24px,5vw,48px);font-weight:1000;letter-spacing:8px;
  text-shadow:0 0 8px #fff,0 0 22px #ff7a18,0 0 45px #a855f7;
}
.m18-impact{
  animation:m18TileImpact .48s ease-out both;
}
@keyframes m18TileImpact{
  0%{transform:scale(1);filter:brightness(1)}
  35%{transform:scale(1.16);filter:brightness(2.5);box-shadow:0 0 30px rgba(253,230,138,.95)}
  100%{transform:scale(.35);opacity:0;filter:brightness(3) blur(1px)}
}
</style>

</head>
<body>
<canvas class="bg-canvas" id="bgCanvas"></canvas>
<canvas class="particle-canvas" id="particleCanvas"></canvas>
<div class="container" id="main-container">
  <div class="title-wrap">
    <span class="title-icon">✨</span>
    <h1>點我 +1</h1>
    <span class="title-icon">✨</span>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><label>最佳得分</label><span id="best-score">0</span></div>
    <div class="stat-card"><label>最大號碼</label><span id="best-num">1</span></div>
    <div class="stat-card hot"><label>最高連擊</label><span id="best-combo">0</span></div>
  </div>
  <div class="score-wrap"><div class="score-val" id="score">0</div></div>
  <div class="multiplier-wrap">
    <span class="multiplier-label">連擊倍率</span>
    <span class="multiplier-val" id="combo-display">x1</span>
    <div class="multiplier-bar"><div class="multiplier-fill" id="combo-fill" style="width:0%"></div></div>
  </div>

  <div class="challenge-panel" id="boss-panel" style="display:none">
    <div class="challenge-top">
      <span class="challenge-title">👹 BOSS 戰</span>
      <span class="challenge-progress" id="boss-progress">0 / 100</span>
    </div>
    <div class="challenge-track"><div class="challenge-fill" id="boss-fill"></div></div>
  </div>
  <div id="event-banner" style="display:none;width:100%;margin:0 0 10px;padding:9px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(6,182,212,.14),rgba(139,92,246,.14));border:1px solid rgba(6,182,212,.22);color:#fff;font-size:.72rem;font-weight:900;text-align:center"></div>

  <div class="challenge-panel">
    <div class="challenge-top">
      <span class="challenge-title">🎯 本局目標</span>
      <span class="challenge-progress" id="challenge-progress">0 / 10</span>
    </div>
    <div class="challenge-track"><div class="challenge-fill" id="challenge-fill"></div></div>
  </div>
<div class="streak-wrap">
    <span class="streak-label">🔥 STREAK</span>
    <div class="streak-timer"><div class="streak-fill" id="streak-fill"></div></div>
  </div>
  <div class="power-row" style="grid-template-columns:1fr 1fr 1fr">
    <button class="power-btn" id="bomb-btn" onclick="useBomb()">🔥 火球術 <small>2⚡</small></button>
    <button class="power-btn" id="reroll-btn" onclick="useMeteor()">☄️ 隕石術 <small>3⚡</small></button>
    <button class="power-btn" id="double-btn" onclick="toggleDouble()">⚡ 火力加倍 <small id="double-cost">2⚡</small></button>
  </div>

  
  <div class="energy-bar-container">
    <div class="energy-text"><span>⚡ 能量</span><span id="energy-count">5 / 5</span></div>
    <div class="energy-pips" id="energy-pips"></div>
  </div>
  <div class="game-board-wrapper">
    <div class="board-glow"></div>
    <div class="level-badge" id="level-badge">LV 1</div>
    <div class="game-board" id="board"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-hint" id="hint-btn" onclick="showHint()">🎯</button>
    <button class="btn btn-reset" onclick="resetGame()">重新部署</button>
  </div>
</div>
<div class="modal" id="game-over-modal">
  <div class="modal-card">
    <div style="font-size:3rem;margin-bottom:10px">🎮</div>
    <h2>遊戲結束</h2>
    <p>能量耗盡且沒有可用合併</p>
    <p style="margin-top:10px">本次得分</p>
    <div class="modal-score" id="final-score">0</div>
    <button class="modal-btn" onclick="resetGame()">再戰一回 🔥</button>
  </div>
</div>
<script>
// ── Background animated stars ──
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const stars = Array.from({length:120}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random()*1.5+0.3, a: Math.random(),
  speed: Math.random()*0.0003+0.0001
}));
function resizeBg() { bgCanvas.width=innerWidth; bgCanvas.height=innerHeight; }
resizeBg(); window.addEventListener('resize', resizeBg);
function drawBg() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  const g = bgCtx.createRadialGradient(bgCanvas.width*0.3,bgCanvas.height*0.2,0,bgCanvas.width*0.5,bgCanvas.height*0.5,bgCanvas.width);
  g.addColorStop(0,'#1a0533'); g.addColorStop(0.5,'#0d0221'); g.addColorStop(1,'#000');
  bgCtx.fillStyle=g; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  stars.forEach(s => {
    s.a += s.speed; if(s.a>1) s.a=0;
    const alpha = Math.sin(s.a*Math.PI)*0.8+0.1;
    bgCtx.beginPath(); bgCtx.arc(s.x*bgCanvas.width, s.y*bgCanvas.height, s.r, 0, Math.PI*2);
    bgCtx.fillStyle=`rgba(255,255,255,${alpha})`; bgCtx.fill();
  });
  requestAnimationFrame(drawBg);
}
drawBg();

// ── Particle system ──
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
const particles = [];
function resizeP() { pCanvas.width=innerWidth; pCanvas.height=innerHeight; }
resizeP(); window.addEventListener('resize', resizeP);
function spawnParticles(x, y, color, count=18) {
  for(let i=0;i<count;i++) {
    const angle = (Math.PI*2/count)*i + Math.random()*0.5;
    const speed = Math.random()*5+2;
    particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
      r: Math.random()*5+3, color, alpha:1, life:1,
      decay: Math.random()*0.03+0.02, gravity:0.15
    });
  }
}
function drawParticles() {
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity;
    p.vx*=0.97; p.life-=p.decay; p.alpha=p.life;
    if(p.life<=0){particles.splice(i,1);continue;}
    pCtx.save(); pCtx.globalAlpha=p.alpha;
    pCtx.beginPath(); pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pCtx.fillStyle=p.color; pCtx.fill(); pCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ── Sound ──
const SoundSystem = {
  ctx: null,
  init() { if(!this.ctx) this.ctx=new(window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); },
  play(action, combo=1) {
    this.init();
    if(action==='tap') { this.tone(600,0.08,0.08,'sine'); this.tone(900,0.05,0.06,'sine'); }
    else if(action==='match') {
      const base = 400+combo*80;
      this.tone(base,0.15,0.1,'sine');
      setTimeout(()=>this.tone(base*1.25,0.2,0.15,'sine'),60);
      setTimeout(()=>this.tone(base*1.5,0.25,0.25,'sine'),120);
      if(combo>=5) setTimeout(()=>this.tone(base*2,0.3,0.3,'triangle'),200);
    } else if(action==='fireball') {
      this.tone(180,0.10,0.08,'sawtooth');
      setTimeout(()=>this.tone(520,0.16,0.12,'triangle'),70);
      setTimeout(()=>this.tone(880,0.20,0.16,'sine'),130);
    } else if(action==='meteor') {
      this.tone(90,0.18,0.12,'sawtooth');
      setTimeout(()=>this.tone(140,0.25,0.18,'sawtooth'),90);
      setTimeout(()=>this.tone(70,0.40,0.28,'triangle'),180);
      setTimeout(()=>this.tone(980,0.22,0.18,'sine'),300);
    } else if(action==='gameover') {
      [400,350,300,250].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,0.3,'sawtooth'),i*120));
    }
  },
  tone(f,v,d,type='sine') {
    const now=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,now);
    o.connect(g); g.connect(this.ctx.destination);
    g.gain.setValueAtTime(v,now); g.gain.exponentialRampToValueAtTime(0.0001,now+d);
    o.start(); o.stop(now+d);
  }
};

// ── Game state ──
const colorClasses = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10'];
const cellColors = ['#ff6b9d','#4facfe','#43e97b','#fa709a','#a18cd1','#f093fb','#4facfe','#667eea','#f7971e','#f43f5e'];
let state = {
  board:[], score:0, energy:5, combo:0, isLocked:false, level:1, totalMerges:0,
  streak:0, doubleNext:false, missionBase:10,
  special:{},
  boss:{active:false,hp:100,maxHp:100,turns:0},
  event:null,
  gamesPlayed:Number(localStorage.getItem('cg_games')||0)
};
let streakTimer = null;
let streakUntil = 0;

const cells = [];
let hintTimeout = null;
let hintCells = [];

function init() {
  ['mousedown','touchstart'].forEach(e=>document.body.addEventListener(e,()=>SoundSystem.init(),{once:true}));
  buildPips();
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  cells.length = 0;
  for(let i=0;i<36;i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const span = document.createElement('span');
    cell.appendChild(span);
    cell.addEventListener('click', ()=>handleCellClick(i));
    boardEl.appendChild(cell);
    cells.push({el:cell, span});
  }
  loadData();
  state.inputQueue = [];
  if(!state.board||state.board.length===0) resetGame();
  else render(true);
}

function buildPips() {
  const container = document.getElementById('energy-pips');
  container.innerHTML = '';
  for(let i=0;i<5;i++) {
    const pip = document.createElement('div');
    pip.className = 'pip';
    pip.id = `pip-${i}`;
    container.appendChild(pip);
  }
}

function loadData() {
  const saved = localStorage.getItem('clickgame_v10');
  if(saved) {
    state=JSON.parse(saved); state.isLocked=false;
    state.streak=Number(state.streak)||0;
    state.doubleNext=!!state.doubleNext;
    state.missionBase=Number(state.missionBase)||10;
    state.special=state.special||{};
    state.boss=state.boss||{active:false,hp:100,maxHp:100,turns:0};
    state.event=state.event||null;
    state.gamesPlayed=Number(state.gamesPlayed)||0;
  }
}

function saveData() {
  localStorage.setItem('clickgame_v3', JSON.stringify(state));
  const bs=Number(localStorage.getItem('cg_best_score'))||0;
  if(state.score>bs) localStorage.setItem('cg_best_score',state.score);
  const maxVal=Math.max(...state.board,1);
  const bn=Number(localStorage.getItem('cg_best_num'))||1;
  if(maxVal>bn) localStorage.setItem('cg_best_num',maxVal);
  const bc=Number(localStorage.getItem('cg_best_combo'))||0;
  if(state.combo>bc) localStorage.setItem('cg_best_combo',state.combo);
}

function resetGame() {
  document.getElementById('game-over-modal').classList.remove('active');
  state.board = Array(36).fill(0).map(()=>Math.floor(Math.random()*4)+1);
  state.score=0; state.energy=5; state.combo=0; state.isLocked=false;
  state.level=1; state.totalMerges=0;
  clearHint();
  saveData(); render(true);
}

function getLevel(merges) { return Math.floor(merges/10)+1; }

function render(full=false) {
  state.board.forEach((val,i)=>{
    const c=cells[i];
    let specialCls='';
    const cls = 'cell ' + (colorClasses[(val-1)%10]||'') + (state.boss.active && i===0 ? ' boss-cell' : '');
    if(full || c.el.className!==cls) {
      c.el.className = cls;
      c.span.innerText = val||'';
      c.el.style.opacity = val===0?'0':'1';
      c.el.style.pointerEvents = val===0?'none':'auto';
    }
  });
  // Score
  const scoreEl = document.getElementById('score');
  scoreEl.innerText = state.score.toLocaleString();
  // Energy pips
  for(let i=0;i<5;i++) {
    const pip=document.getElementById(`pip-${i}`);
    if(pip) pip.className='pip'+(i<state.energy?' active':'');
  }
  document.getElementById('energy-count').innerText=`${state.energy} / 5`;
  // Combo display
  const comboEl=document.getElementById('combo-display');
  const comboFill=document.getElementById('combo-fill');
  comboEl.innerText=`x${Math.max(1,state.combo)}`;
  comboFill.style.width=`${Math.min(state.combo/10*100,100)}%`;
  if(state.combo>=5) comboEl.style.color='#f43f5e';
  else if(state.combo>=3) comboEl.style.color='#fb923c';
  else comboEl.style.color='#fbbf24';
  // Boss / random event HUD
  const bp=document.getElementById('boss-panel');
  bp.style.display=state.boss.active?'block':'none';
  document.getElementById('boss-progress').innerText=`${Math.max(0,state.boss.hp)} / ${state.boss.maxHp}`;
  document.getElementById('boss-fill').style.width=`${Math.max(0,state.boss.hp/state.boss.maxHp*100)}%`;
  const eb=document.getElementById('event-banner');
  if(state.event){ eb.style.display='block'; eb.innerText=state.event; }
  else eb.style.display='none';

  // Mission / powerups
  const lvNow=getLevel(state.totalMerges);
  const missionGoal=8 + lvNow*2;
  const missionDone=state.totalMerges % missionGoal;
  document.getElementById('challenge-progress').innerText=`${missionDone} / ${missionGoal}`;
  document.getElementById('challenge-fill').style.width=`${Math.min(100,missionDone/missionGoal*100)}%`;
  document.getElementById('bomb-btn').disabled=false;
  document.getElementById('reroll-btn').disabled=false;
  document.getElementById('double-btn').disabled=false;
  document.getElementById('bomb-btn').classList.toggle('spell-unavailable', state.energy<=2 || state.isLocked);
  document.getElementById('reroll-btn').classList.toggle('spell-unavailable', state.energy<=3 || state.isLocked);
  const doubleBtn=document.getElementById('double-btn');
  doubleBtn.classList.toggle('spell-unavailable', (state.energy<=2 && !state.doubleNext) || state.isLocked);
  doubleBtn.classList.toggle('double-active',!!state.doubleNext);
  document.getElementById('double-cost').innerText=state.doubleNext?'已啟用：下一次合併 ×2':'消耗 2 能量';
  document.getElementById('streak-fill').style.width=state.streak>0 ? `${Math.max(0,Math.min(100,(streakUntil-Date.now())/3500*100))}%` : '0%';

  // Level
  const lv=getLevel(state.totalMerges);
  document.getElementById('level-badge').innerText=`LV ${lv}`;
  // Best stats
  document.getElementById('best-score').innerText=(localStorage.getItem('cg_best_score')||0).toLocaleString();
  document.getElementById('best-num').innerText=localStorage.getItem('cg_best_num')||1;
  document.getElementById('best-combo').innerText=localStorage.getItem('cg_best_combo')||0;
}

async function handleCellClick(idx) {
  if(state.isLocked||state.energy<=0) return;
  clearHint();
  state.isLocked=true;
  SoundSystem.play('tap');
  state.energy--;
  state.combo=0;

  const special=state.special[idx];
  if(special){
    await triggerSpecial(idx,special,true);
    render();
    await applyGravity();
    // 爆破後檢查新形成的普通連鎖
    await resolveAutoMatches();
  } else {
    state.board[idx]++;
    cells[idx].el.classList.add('idle-bounce');
    setTimeout(()=>cells[idx].el.classList.remove('idle-bounce'),250);
    render();
    await processMatches(idx);
  }

  state.isLocked=false;
  saveData();
  render();
  if(state.energy<=0&&!hasPossibleMatch()) endGame();
}

async function processMatches(startIdx) {
  let targetIdx=startIdx;
  while(targetIdx!==-1) {
    const matches=findMatches(targetIdx);
    if(matches.length>=3) {
      state.combo++;
      state.totalMerges++;
      const bc=Number(localStorage.getItem('cg_best_combo'))||0;
      if(state.combo>bc) { localStorage.setItem('cg_best_combo',state.combo); document.getElementById('best-combo').innerText=state.combo; }

      // 先記錄所有待引爆，避免一般合併動畫先把它們清掉。
      const triggeredSpecials=matches
        .filter(i=>false)
        .map(i=>({idx:i,type:false,value:state.board[i]}));

      const val=state.board[targetIdx];
      state.streak++;
      startStreak();
      const streakBonus=Math.min(5, Math.max(0, Math.floor(state.streak/3)));
      const doubleMult=state.doubleNext ? 2 : 1;
      const eventMult=state.eventBoost>0 ? 1.5 : 1;
      const ptsAdded=Math.floor(val*matches.length*state.combo*(1+streakBonus)*10*doubleMult*eventMult);
      if(state.eventBoost>0) state.eventBoost--;
      state.score+=ptsAdded;
      state.doubleNext=false;

      if(state.boss.active){
        const dmg=Math.max(1,Math.floor(ptsAdded/25));
        state.boss.hp-=dmg;
        state.boss.turns++;
        showFeedback(targetIdx,`👹 -${dmg}`,0);
        if(state.boss.hp<=0){
          state.score+=1000;
          state.energy=Math.min(5,state.energy+2);
          state.boss.active=false;
          state.totalMerges+=3;
          showFeedback(targetIdx,'👑 BOSS DEFEATED +1000',0);
          const rect=cells[targetIdx].el.getBoundingClientRect();
          spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,'#fbbf24',50);
        }
      }

      state.energy=Math.min(5,state.energy+1);
      SoundSystem.play('match',state.combo);

      const scoreEl=document.getElementById('score');
      scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');

      const rect=cells[targetIdx].el.getBoundingClientRect();
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
      const color=cellColors[(val-1)%10];
      spawnParticles(cx,cy,color,state.combo>=5?30:18);
      if(state.combo>=3) spawnParticles(cx,cy,'#fbbf24',10);
      showFeedback(targetIdx,`+${ptsAdded}`,state.combo);

      if(state.totalMerges % (8 + getLevel(state.totalMerges)*2) === 0) {
        state.energy=Math.min(5,state.energy+2);
        showFeedback(targetIdx,'🎯 任務達成 +2⚡',0);
      }
      if(state.combo>=8) {
        const c=document.getElementById('main-container');
        c.classList.add('shake-active');
        setTimeout(()=>c.classList.remove('shake-active'),300);
      }

      // 若本次合併碰到，先整批引爆。
      // 這是修正重點：不能等普通合併把清成 0 後才觸發。
      if(triggeredSpecials.length){
        await Promise.all(
          triggeredSpecials.map(s=>triggerSpecial(
            s.idx,s.type,false,new Set(),s.value
          ))
        );
        render();
        await new Promise(r=>setTimeout(r,120));
      }

      // 合併動畫只處理仍然存在的普通方塊。
      const aliveMatches=matches.filter(i=>state.board[i]>0 && i!==targetIdx);
      const movePromises=aliveMatches.map(async(i)=>{
        const cellEl=cells[i].el;
        const tRect=cells[targetIdx].el.getBoundingClientRect();
        const oRect=cellEl.getBoundingClientRect();
        cellEl.classList.add('merging');
        cellEl.style.transform=`translate(${tRect.left-oRect.left}px,${tRect.top-oRect.top}px) scale(0.2)`;
        cellEl.style.opacity='0';
        state.board[i]=0;
        
      });

      await Promise.all([...movePromises,new Promise(r=>setTimeout(r,200))]);
      matches.forEach(i=>{
        cells[i].el.classList.remove('merging');
        cells[i].el.style.transform='';
        cells[i].el.style.opacity='1';
      });

      // 如果 target 本身在連鎖中已被清掉，就不要把它「復活」。
      if(state.board[targetIdx]>0){
        state.board[targetIdx]++;

cells[targetIdx].el.classList.add('target-pulse');
        render();
        await new Promise(r=>setTimeout(r,100));
        cells[targetIdx].el.classList.remove('target-pulse');
      }

      // 每次爆破/合併後都重力補滿，再掃描真正相鄰的連鎖。
      await applyGravity();

      targetIdx=-1;
      for(let i=0;i<36;i++) {
        if(state.board[i]>0 && findMatches(i).length>=3){
          targetIdx=i;
          break;
        }
      }
    } else {
      targetIdx=-1;
    }
  }
}

function findMatches(idx) {
  const val = state.board[idx];
  if (!val) return [];

  // 只允許上下左右相鄰；斜角不算連線。
  const queue = [idx];
  const result = [];
  const visited = new Set([idx]);

  while (queue.length) {
    const curr = queue.shift();
    result.push(curr);

    const r = Math.floor(curr / 6);
    const c = curr % 6;
    const neighbors = [
      [r - 1, c], [r + 1, c],
      [r, c - 1], [r, c + 1]
    ];

    for (const [nr, nc] of neighbors) {
      if (nr < 0 || nr >= 6 || nc < 0 || nc >= 6) continue;
      const ni = nr * 6 + nc;
      if (!visited.has(ni) && state.board[ni] === val) {
        visited.add(ni);
        queue.push(ni);
      }
    }
  }
  return result;
}

async function applyGravity() {
  let dropped=false;
  for(let c=0;c<6;c++) {
    let emptyRow=-1;
    for(let r=5;r>=0;r--) {
      const idx=r*6+c;
      if(state.board[idx]===0) { if(emptyRow===-1) emptyRow=r; }
      else if(emptyRow!==-1) {
        state.board[emptyRow*6+c]=state.board[idx]; state.board[idx]=0;
        if(state.special[idx]) { state.special[emptyRow*6+c]=state.special[idx]; delete state.special[idx]; }
        cells[emptyRow*6+c].el.classList.add('dropping'); emptyRow--; dropped=true;
      }
    }
    for(let r=emptyRow;r>=0&&r!==-1;r--) {
      state.board[r*6+c]=Math.floor(Math.random()*4)+1;
      delete state.special[r*6+c];
      cells[r*6+c].el.classList.add('dropping'); dropped=true;
    }
  }
  render();
  if(dropped) { await new Promise(r=>setTimeout(r,220)); cells.forEach(c=>c.el.classList.remove('dropping')); }
}

function hasPossibleMatch() {
  for(let i=0;i<36;i++) { if(state.board[i]>0&&findMatches(i).length>=3) return true; }
  return false;
}




function rerollTiles(){ useMeteor(); }

async function triggerSpecial(idx,type,manual=false,seen=new Set(),forcedValue=null){
  if(idx<0 || idx>=36 || !type) return;
  if(seen.has(idx)) return;
  seen.add(idx);

  const r=Math.floor(idx/6), c=idx%6;
  const value=forcedValue ?? state.board[idx] ?? 1;
  let targets=[];

  if(type==='bomb'){
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<6&&nc>=0&&nc<6) targets.push(nr*6+nc);
    }
  } else if(type==='star'){
    for(let i=0;i<6;i++){ targets.push(r*6+i); targets.push(i*6+c); }
  } else if(type==='rainbow'){
    targets=state.board.map((v,i)=>v===value?i:-1).filter(i=>i>=0);
  }

  targets=[...new Set(targets)];

  // 先抓出本次爆炸會碰到的特殊方塊，再清場，避免特殊方塊被清掉後失去觸發資格。
  const chain=targets
    .filter(i=>i!==idx && state.special[i])
    .map(i=>({idx:i,type:state.special[i],value:state.board[i]}));

  targets.forEach(i=>{
    state.board[i]=0;
    delete state.special[i];
    cells[i]?.el.classList.add('chain-explode');
  });

  const rect=cells[idx]?.el?.getBoundingClientRect();
  if(rect){
    const color=type==='bomb'?'#f43f5e':type==='star'?'#fbbf24':'#06b6d4';
    spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,color,32);
  }

  state.score += targets.length * (type==='rainbow' ? Math.max(1,value)*20 : 20);
  if(manual) state.energy=Math.min(5,state.energy+1);
  SoundSystem.play('match',Math.min(8,state.combo+2));
  render();

  // 不把整個遊戲鎖死等待動畫；只留極短視覺節奏，讓玩家很快恢復操作。
  await new Promise(r=>setTimeout(r,90));

  for(const sp of chain){
    await triggerSpecial(sp.idx,sp.type,false,seen,sp.value);
  }

  targets.forEach(i=>cells[i]?.el.classList.remove('chain-explode'));
}

async function resolveAutoMatches(){
  let guard=0;
  while(guard++<20){
    let idx=-1;
    for(let i=0;i<36;i++){
      if(state.board[i] && findMatches(i).length>=3){
        idx=i;
        break;
      }
    }
    if(idx<0) break;
    await processMatches(idx);
  }
}

function startStreak() {
  streakUntil=Date.now()+3500;
  clearTimeout(streakTimer);
  const tick=()=>{
    if(Date.now()>=streakUntil){
      state.streak=0;
      render();
      return;
    }
    render();
    streakTimer=setTimeout(tick,100);
  };
  tick();
}
function stopStreak() {
  clearTimeout(streakTimer);
  streakTimer=null;
  streakUntil=0;
  state.streak=0;
}


let energyToastTimer=null;
function showEnergyWarning(cost){
  const el=document.getElementById('energy-warning-toast');
  if(!el) return;
  el.textContent=`⚡ 能量不足：施法後必須保留至少 1 點能量（本技能消耗 ${cost} 點）`;
  el.classList.add('show');
  clearTimeout(energyToastTimer);
  energyToastTimer=setTimeout(()=>el.classList.remove('show'),1400);
}

function useBomb() {
  if(state.isLocked) return;
  if(state.energy<=2){ showEnergyWarning(2); return; }
  clearHint();
  state.isLocked=true;
  state.energy-=2;

  // 火球術：選取一格作為落點，焚燒該格周圍 3×3。
  const center=Math.floor(Math.random()*36);
  const r=Math.floor(center/6), c=center%6;
  const targets=[];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<6&&nc>=0&&nc<6){
      const i=nr*6+nc;
      if(state.board[i]>0) targets.push(i);
    }
  }

  const rect=cells[center].el.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  spawnParticles(cx,cy,'#ff7a18',55);
  spawnParticles(cx,cy,'#ffd166',28);

  targets.forEach(i=>{
    state.board[i]=0;
    cells[i].el.classList.add('target-pulse');
  });
  const removed=targets.reduce((sum,i)=>sum+state.board[i],0);
  state.score += removed*20 + targets.length*10;
  state.combo=0;
  SoundSystem.play('fireball');
  render();

  setTimeout(()=>targets.forEach(i=>cells[i].el.classList.remove('target-pulse')),420);
  setTimeout(async()=>{
    await applyGravity();
    state.isLocked=false;
    saveData(); render();
    if(state.energy<=0&&!hasPossibleMatch()) endGame();
  },480);
}

async function useMeteor(){
  if(state.isLocked) return;
  if(state.energy<=3){ showEnergyWarning(3); return; }

  clearHint();
  state.isLocked=true;
  state.energy-=3;
  state.combo=0;
  render();

  const board=document.querySelector('.game-board');
  if(!board){
    state.isLocked=false;
    return;
  }

  // 每次施法建立全新的動畫 DOM，確保第二次、第三次都從初始狀態播放。
  const fx=document.createElement('div');
  fx.id='meteor-runtime-v18';
  fx.innerHTML=`
    <div class="m18-meteor"></div>
    <div class="m18-flash"></div>
    <div class="m18-ring"></div>
    <div class="m18-title">☄️ 隕石術</div>
  `;
  document.body.appendChild(fx);

  const meteor=fx.querySelector('.m18-meteor');
  const flash=fx.querySelector('.m18-flash');
  const ring=fx.querySelector('.m18-ring');
  const title=fx.querySelector('.m18-title');

  // ① 蓄力
  cells.forEach(c=>c.el.classList.add('meteor-charge'));
  await new Promise(r=>setTimeout(r,420));

  // ② 每次重新測量棋盤中心
  const br=board.getBoundingClientRect();
  const targetX=br.left+br.width/2;
  const targetY=br.top+br.height/2;
  fx.style.setProperty('--ix',targetX+'px');
  fx.style.setProperty('--iy',targetY+'px');

  // ③ 真正逐幀掉落
  const startX=window.innerWidth/2;
  const startY=-220;
  const duration=2300;
  const t0=performance.now();

  await new Promise(resolve=>{
    function frame(now){
      const p=Math.min(1,(now-t0)/duration);
      const e=1-Math.pow(1-p,1.58);
      const x=startX+(targetX-startX)*e;
      const y=startY+(targetY-startY)*e;
      const scale=.48+.82*e;
      meteor.style.left=x+'px';
      meteor.style.top=y+'px';
      meteor.style.opacity='1';
      meteor.style.transform=`translate(-50%,-50%) rotate(35deg) scale(${scale})`;
      if(p<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });

  // ④ 精準撞擊棋盤中心
  meteor.style.opacity='0';
  flash.style.opacity='1';
  ring.style.opacity='1';
  title.style.opacity='1';

  await new Promise(r=>setTimeout(r,70));

  let removed=0;
  for(let i=0;i<36;i++){
    removed+=state.board[i]||0;
    state.board[i]=0;
    cells[i].el.classList.remove('meteor-charge');
    cells[i].el.classList.add('m18-impact');
  }
  state.score+=removed*30+500;
  render();

  ring.style.transition='transform .82s cubic-bezier(.08,.72,.08,1),opacity .82s ease';
  ring.style.transform='translate(-50%,-50%) scale(28)';
  flash.style.transition='opacity .4s ease';
  title.style.transition='opacity .45s ease,transform .5s ease';
  flash.style.opacity='0';
  title.style.opacity='0';
  title.style.transform='translate(-50%,-50%) scale(1.16)';

  spawnParticles(targetX,targetY,'#fff',80);
  spawnParticles(targetX,targetY,'#ffb703',180);
  spawnParticles(targetX,targetY,'#f43f5e',120);
  spawnParticles(targetX,targetY,'#a78bfa',160);

  await new Promise(r=>setTimeout(r,460));

  // ⑤ 快速補滿
  for(let i=0;i<36;i++){
    state.board[i]=Math.floor(Math.random()*3)+1;
    cells[i].el.classList.remove('m18-impact');
  }
  render();

  cells.forEach(c=>{
    c.el.classList.add('magic-refill');
    setTimeout(()=>c.el.classList.remove('magic-refill'),220);
  });

  await new Promise(r=>setTimeout(r,240));
  fx.remove();

  state.isLocked=false;
  saveData();
  render();
  if(state.energy<=0&&!hasPossibleMatch()) endGame();
}

function toggleDouble() {
  if(state.isLocked) return;
  if(state.energy<=2 && !state.doubleNext){ showEnergyWarning(2); return; }
  if(state.doubleNext){ state.doubleNext=false; render(); return; }
  if(state.energy<2) return;
  state.energy-=2;
  state.doubleNext=true;
  SoundSystem.play('tap');
  render();
}
function endGame() {
  SoundSystem.play('gameover');
  document.getElementById('final-score').innerText=state.score.toLocaleString();
  document.getElementById('game-over-modal').classList.add('active');
}

function showHint() {
  clearHint();

  // ① 優先找目前已存在的 3+ 相鄰組。
  let best=[], bestScore=0;
  for(let i=0;i<36;i++){
    if(!state.board[i]) continue;
    const m=findMatches(i);
    if(m.length>=3 && m.length>bestScore){
      bestScore=m.length;
      best=m;
    }
  }

  // ② 如果目前沒有立即可消的組，搜尋「點哪一格後會形成 3+」。
  let suggested=-1, suggestedGroup=[];
  if(best.length<3){
    for(let i=0;i<36;i++){
      if(!state.board[i]) continue;
      const original=state.board[i];
      state.board[i]=original+1;
      const m=findMatches(i);
      state.board[i]=original;
      if(m.length>=3){
        suggested=i;
        suggestedGroup=m;
        break;
      }
    }
  }

  if(best.length>=3){
    hintCells=best;
    best.forEach(i=>cells[i].el.classList.add('hint-glow'));
    const btn=document.getElementById('hint-btn');
    btn.classList.add('hint-active');
    setTimeout(()=>btn.classList.remove('hint-active'),1600);
    hintTimeout=setTimeout(clearHint,2000);
    return;
  }

  if(suggested>=0){
    hintCells=suggestedGroup.length?suggestedGroup:[suggested];
    hintCells.forEach(i=>cells[i].el.classList.add('hint-glow'));
    cells[suggested].el.classList.add('hint-suggest');
    const btn=document.getElementById('hint-btn');
    btn.classList.add('hint-active');
    setTimeout(()=>btn.classList.remove('hint-active'),1600);
    hintTimeout=setTimeout(()=>{
      cells[suggested]?.el.classList.remove('hint-suggest');
      clearHint();
    },2000);
    showFeedback(suggested,'🎯 建議點這格',0);
    return;
  }

  // ③ 完全沒有可形成合併的點擊，仍給玩家明確回饋，而非看起來「沒反應」。
  const btn=document.getElementById('hint-btn');
  btn.classList.add('hint-active');
  setTimeout(()=>btn.classList.remove('hint-active'),400);
  showFeedback(Math.floor(Math.random()*36),'沒有可用連鎖',0);
}
function clearHint() {
  if(hintTimeout) clearTimeout(hintTimeout);
  hintCells.forEach(i=>{ if(cells[i]) cells[i].el.classList.remove('hint-glow'); });
  hintCells=[];
}

function showFeedback(idx, pts, combo) {
  const rect=cells[idx].el.getBoundingClientRect();
  const div=document.createElement('div');
  div.className='floating-container';
  div.style.left=`${rect.left+rect.width/2}px`;
  div.style.top=`${rect.top+rect.height/2}px`;
  div.style.transform='translate(-50%,-50%)';
  const p=document.createElement('div');
  p.className='floating-pts'; p.innerText=pts;
  div.appendChild(p);
  if(combo>1) {
    const c=document.createElement('div');
    c.className='floating-combo';
    c.innerText=`COMBO x${combo}`;
    if(combo>=10) { c.style.fontSize='2.4rem'; c.style.color='#f43f5e'; }
    if(combo>=20) { c.style.fontSize='3rem'; c.style.color='#fbbf24'; }
    div.appendChild(c);
  }
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),900);
}
